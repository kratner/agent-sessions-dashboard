# Builds a version tag (v1.2.3), publishes it to the VS Code Marketplace, then creates the GitHub
# release. Marketplace first: a release on GitHub means the Marketplace has it too, which the
# extension's own update check relies on.
# Cut a release with `npm run release`, which checks everything and pushes the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Marketplace Trusted Publishing: GitHub's OIDC token stands in for a stored access token.
  # The fourounces publisher has a Trusted Publishing policy for this repo and release.yml.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All tags, so the notes can link a comparison with the previous release.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)" >&2
            exit 1
          fi

      - run: npm test

      # Typecheck, minified build, dependency-leak check, then the .vsix.
      - run: npm run package

      # --skip-duplicate lets a failed run be re-run after the Marketplace step succeeded.
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc --skip-duplicate --packagePath ./*.vsix

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --notes-file release-notes.md
